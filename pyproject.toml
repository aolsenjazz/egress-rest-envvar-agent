[project]
name = "rest-envvar-agent"
version = "0.1.0"
description = "Fixture agent: REST egress via base URL from an environment variable"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rest_envvar"]
